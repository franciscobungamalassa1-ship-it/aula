<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
  
</head>
<body>
  
    <div class="media">
        <h1>Sistema de Média</h1>
        <label for="nota1">Primeira nota</label>
        <input type="number" id="nota1" placeholder="Insira a nota">
        <label for="nota2">Segunda nota</label>
        <input type="number" id="nota2" placeholder="Insira a nota">
        <label for="nota3">Terceira nota</label>
        <input type="number" id="nota3" placeholder="Insira a nota">
        <button onclick="media()">Calcular média</button>
        <p id="resultado"></p>
    </div>
<script src="media.js"></script>
</body>
</html>
